name: Feature request
description: Something the library should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the "What this library will not do" section of
        [CONTRIBUTING.md](https://github.com/MichaelZett/zs-identity/blob/main/CONTRIBUTING.md)
        first. The most common reason a request is declined is that it would
        require the building block to know something about the application
        embedding it.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to build, and where does the library get in the
        way? Describe the situation, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: >
        How you work around it now — your own bean replacing one of ours, a
        second table in your application, a copied view. This says a lot about
        where the seam belongs.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: A possible shape
      description: Optional. An API sketch, a setting name, a migration.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This would be useful to more than one application, not just mine.
        - label: This does not require the library to know anything about my domain.
