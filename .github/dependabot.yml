# Keeps the GitHub Actions in the workflows up to date -- the counterpart of
# `./gradlew dependencyUpdates` for the libraries. With floating major tags
# (@v7), Dependabot reports exactly the major jumps; minor and patch arrive
# through the tag by themselves. All bumps collected in one weekly PR.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
