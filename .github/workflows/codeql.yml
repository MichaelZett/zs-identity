# CodeQL scans the code for security problems that a compiler and the usual
# static analysis do not see: injection, unsafe deserialisation, leaking
# credentials. For a building block that handles sign-in, that is worth having.
#
# It stays dormant until the repository is public. CodeQL is free for public
# repositories; on a private one it needs GitHub Advanced Security, and without
# that licence every run would fail on an entitlement error rather than on a
# finding.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 05:00. A scheduled run matters because the queries improve over
    # time: code that was clean last month can be flagged today without anyone
    # touching it.
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Manual instead of autobuild: autobuild guesses at the build and would
      # run the tests as well, which start PostgreSQL through Testcontainers.
      # CodeQL only needs the compiled classes.
      #
      # Without the build cache: CodeQL reads the code by watching javac, and a
      # push that leaves the sources alone (README, workflow) would otherwise
      # take every class from the cache -- no javac, nothing seen, the run fails.
      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon --no-build-cache

      - name: Analyze
        uses: github/codeql-action/analyze@v4
