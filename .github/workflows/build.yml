name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs the history: without it every line looks new, and
          # "new code" -- the part a quality gate actually judges -- is empty.
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(grep '^version=' gradle.properties | cut -d'=' -f2)"
          if [ -z "$VERSION" ]; then
            echo "version is missing from gradle.properties"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Analysis reuses what the build just produced (compiled classes, test
      # results, the JaCoCo XML report) instead of building a second time.
      #
      # It stays dormant until SONAR_TOKEN exists, so the build does not break
      # on a repository that has not been connected yet. Two cases end up here
      # without a token and are meant to: a fork's pull request never sees
      # secrets, and neither does anyone who clones this repository.
      - name: Analyse with SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --no-daemon
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

      # Counts, failures and durations on the run's summary page, every run.
      # annotate_only keeps it off the Checks API, so contents: read suffices.
      - name: Summarise test results
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d  # v6.5.0
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          include_time_in_summary: true

      # The HTML reports of every run, but only for a few days: they are only
      # worth opening while the run is recent.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 3
          if-no-files-found: ignore

  # Release path as in terminplanung-halle: if gradle.properties on main holds
  # a version without -SNAPSHOT, the pipeline publishes to GitHub Packages,
  # creates the tag and the GitHub release v<version>, and then raises the
  # version to the next patch SNAPSHOT. SNAPSHOTs are never published -- the
  # applications depend on release versions only.
  #
  # From 1.0.0 on it uploads to Maven Central first. The upload only creates a
  # deployment in the Central Portal; releasing it is a click there, by hand,
  # because a version on Central can never be removed or replaced. Before
  # 1.0.0 the step stays out: 0.x may still break, and on Central it would
  # stay forever.
  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.build.outputs.is_snapshot == 'false'
    permissions:
      contents: write
      packages: write
    # Every release version is signed, the one for GitHub Packages as well --
    # the publish plugin signs all publications. Only this job sees the key: it
    # runs on a push to main, never for a pull request.
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Refuse to release an existing version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists - raise the version in gradle.properties."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Upload to Maven Central (from 1.0.0 on)
        if: ${{ !startsWith(needs.build.outputs.version, '0.') }}
        run: ./gradlew publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true

      - name: Bump version to next patch SNAPSHOT
        env:
          CURRENT: ${{ needs.build.outputs.version }}
        run: |
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version format for the auto bump: $CURRENT"
            exit 1
          fi
          MAJOR="$(echo "$CURRENT" | cut -d. -f1)"
          MINOR="$(echo "$CURRENT" | cut -d. -f2)"
          PATCH="$(echo "$CURRENT" | cut -d. -f3)"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          echo "Bump version: $CURRENT -> $NEXT"
          sed -i "s/^version=.*/version=${NEXT}/" gradle.properties
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -am "Bump version to ${NEXT} [skip ci]"
          git push origin HEAD:main
