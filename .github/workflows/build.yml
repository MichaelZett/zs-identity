name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs the history: without it every line looks new, and
          # "new code" -- the part a quality gate actually judges -- is empty.
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(grep '^version=' gradle.properties | cut -d'=' -f2)"
          if [ -z "$VERSION" ]; then
            echo "version is missing from gradle.properties"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Analysis reuses what the build just produced (compiled classes, test
      # results, the JaCoCo XML report) instead of building a second time.
      #
      # It stays dormant until SONAR_TOKEN exists, so the build does not break
      # on a repository that has not been connected yet. Two cases end up here
      # without a token and are meant to: a fork's pull request never sees
      # secrets, and neither does anyone who clones this repository.
      - name: Analyse with SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --no-daemon
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # Release path as in terminplanung-halle: if gradle.properties on main holds
  # a version without -SNAPSHOT, the pipeline publishes to GitHub Packages,
  # creates the tag and the GitHub release v<version>, and then raises the
  # version to the next patch SNAPSHOT. SNAPSHOTs are never published -- the
  # applications depend on release versions only.
  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.build.outputs.is_snapshot == 'false'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Refuse to release an existing version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists - raise the version in gradle.properties."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true

      - name: Bump version to next patch SNAPSHOT
        env:
          CURRENT: ${{ needs.build.outputs.version }}
        run: |
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version format for the auto bump: $CURRENT"
            exit 1
          fi
          MAJOR="$(echo "$CURRENT" | cut -d. -f1)"
          MINOR="$(echo "$CURRENT" | cut -d. -f2)"
          PATCH="$(echo "$CURRENT" | cut -d. -f3)"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          echo "Bump version: $CURRENT -> $NEXT"
          sed -i "s/^version=.*/version=${NEXT}/" gradle.properties
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -am "Bump version to ${NEXT} [skip ci]"
          git push origin HEAD:main
