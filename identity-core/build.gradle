// Wiederverwendbarer Auth-Baustein: Benutzerkonto, Registrierung, Anmeldung,
// Passwort-Reset, Rollen und Rechte. Bewusst OHNE Vaadin-Abhaengigkeit, damit er
// auch in einer reinen REST-Anwendung nutzbar bleibt — die Views liegen in
// :identity-vaadin.
dependencies {
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    // compileOnly, nicht implementation: Der Baustein fuehrt Flyway nicht selbst
    // aus — das ist Sache der einbindenden Anwendung. Er braucht den Typ nur, um
    // seinen Migrations-Ablageort per FlywayConfigurationCustomizer beizusteuern.
    // Bringt die Anwendung kein Flyway mit, greift @ConditionalOnClass und der
    // Customizer entfaellt ersatzlos.
    compileOnly 'org.springframework.boot:spring-boot-flyway'

    // Ebenfalls compileOnly: Der AuthenticationRefresher schreibt den
    // aufgefrischten SecurityContext in die HTTP-Sitzung zurueck und braucht
    // dafuer die Servlet-Typen. Jede Web-Anwendung bringt sie mit; laeuft der
    // Baustein einmal ohne Servlet-Umgebung, wird der Zweig nie betreten.
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // Ebenfalls compileOnly (seit 0.7.0): Wer Mails verschicken will, nimmt
    // spring-boot-starter-mail selbst auf. Eine REST-Anwendung ohne Mailversand
    // oder eine mit eigenem IdentityMailSender (Transaktionsmail-Dienst) soll
    // sich nicht jakarta.mail aufzwingen lassen. Fehlt die Bibliothek, greift
    // @ConditionalOnClass und der Baustein faellt auf den Log-Versand zurueck.
    compileOnly 'org.springframework.boot:spring-boot-starter-mail'

    testImplementation 'org.springframework.boot:spring-boot-starter-mail'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // Fuer MockHttpServletRequest/-Response: Der Baustein kennt die Servlet-Typen
    // im Hauptcode nur compileOnly, der AuthenticationRefresher-Test braucht sie.
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.springframework.boot:spring-boot-starter-flyway'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
}
