// Reusable authentication building block: user account, registration, sign-in,
// password reset, roles and permissions. Deliberately WITHOUT a Vaadin
// dependency, so that it stays usable in a pure REST application as well; the
// views live in :identity-vaadin.
dependencies {
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    // compileOnly rather than implementation: the building block does not run
    // Flyway itself -- that is the embedding application's business. It needs
    // the type only to contribute its migration location through a
    // FlywayConfigurationCustomizer. If the application brings no Flyway,
    // @ConditionalOnClass applies and the customizer simply falls away.
    compileOnly 'org.springframework.boot:spring-boot-flyway'

    // compileOnly as well: the AuthenticationRefresher writes the refreshed
    // SecurityContext back into the HTTP session and needs the servlet types
    // for that. Every web application brings them; if the building block ever
    // runs without a servlet environment, that branch is never entered.
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // compileOnly as well (since 0.7.0): whoever wants to send mails takes
    // spring-boot-starter-mail themselves. A REST application without mail
    // delivery, or one with its own IdentityMailSender (a transactional mail
    // service), should not have jakarta.mail forced upon it. If the library is
    // missing, @ConditionalOnClass applies and the building block falls back to
    // delivery through the log.
    compileOnly 'org.springframework.boot:spring-boot-starter-mail'

    // compileOnly as well (since 0.11.0): sign-in with passkeys needs Spring
    // Security's WebAuthn module, which brings webauthn4j along. An application
    // that offers passkeys takes the module itself; without it the classes
    // that touch it are never loaded (@ConditionalOnClass), and the security
    // configurer for passkeys is simply not called.
    compileOnly 'org.springframework.security:spring-security-webauthn'

    testImplementation 'org.springframework.security:spring-security-webauthn'
    testImplementation 'org.springframework.boot:spring-boot-starter-mail'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // For MockHttpServletRequest/-Response: the main code knows the servlet
    // types only compileOnly, and the AuthenticationRefresher test needs them.
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // testImplementation, not testRuntimeOnly, since 0.8.0: IdentityMigrationsIT
    // drives Flyway itself to build the layout from before the move.
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
}
