spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # hibernate-jcache is on the test classpath, and Hibernate would switch the
        # cache on by itself; the suite proves the building block without one.
        # SecondLevelCacheIT turns it on.
        cache:
          use_second_level_cache: false
  # spring.flyway.locations is deliberately NOT set here: the building block
  # has to contribute its own location through IdentityFlywayAutoConfiguration.
  # If it did not arrive, the auth_ tables would be missing and every test here
  # would fail on Hibernate's schema validation.
  flyway:
    enabled: true
  # No mail delivery in tests: RecordingMailSender from IdentityTestApplication
  # displaces the JavaMailSender variant.
  mail:
    host: localhost
    port: 1025

zs:
  identity:
    base-url: http://localhost:8080
    token-validity: 24h
    password-min-length: 12

logging:
  level:
    de.zettsystems: DEBUG
    org.hibernate.SQL: WARN
