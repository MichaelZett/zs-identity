spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # spring.flyway.locations ist hier bewusst NICHT gesetzt: Der Baustein muss
  # seinen eigenen Ablageort über IdentityFlywayAutoConfiguration beisteuern.
  # Kaeme er nicht an, blieben die auth_-Tabellen aus und jeder Test hier
  # scheiterte an der Hibernate-Schemapruefung.
  flyway:
    enabled: true
  # Kein Mailversand im Test: RecordingMailSender aus IdentityTestApplication
  # verdrängt die JavaMailSender-Variante.
  mail:
    host: localhost
    port: 1025

zs:
  identity:
    base-url: http://localhost:8080
    token-validity: 24h
    password-min-length: 12

logging:
  level:
    de.zettsystems: DEBUG
    org.hibernate.SQL: WARN
