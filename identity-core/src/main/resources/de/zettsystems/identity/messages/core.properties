# Texts of identity-core: mails and the messages behind IdentityMessageKeys.
# This file without a language suffix is the fallback and is therefore English.
# It applies to every language that has no file of its own.
# Placeholders are MessageFormat patterns ({0}, {1}), not %s.

identity.error.emailAlreadyRegistered=An account already exists for this e-mail address.
identity.error.passwordTooShort=The password must be at least {0} characters long.
identity.error.selfRegistrationDisabled=Registration is switched off for this application.
identity.error.tokenInvalid=This link has expired or has already been used. Please request a new one.
identity.error.tokenExpired=This link has expired or has already been used. Please request a new one.
identity.error.defaultRoleMissing=That did not work. Please try again later.
identity.error.accountNotFound=That did not work. Please try again later.
identity.error.accountAlreadyClaimed=This account already belongs to someone.
identity.error.unexpected=That did not work. Please try again later.

identity.mail.verification.subject=Please confirm your e-mail address
identity.mail.verification.body=Hello {0},\n\
\n\
please confirm your e-mail address using this link:\n\
\n\
{1}\n\
\n\
The link is valid for {2}. If you did not register, you can ignore this message.\n
identity.mail.verification.body.html=<p>Hello {0},</p>\
<p>please confirm your e-mail address using this link:</p>\
<p><a href="{1}">Confirm e-mail address</a></p>\
<p>If the link does not open, copy this address into the address bar of your browser:<br>{1}</p>\
<p>The link is valid for {2}. If you did not register, you can ignore this message.</p>
identity.mail.reset.subject=Reset your password
identity.mail.reset.body=Hello {0},\n\
\n\
you can set a new password using this link:\n\
\n\
{1}\n\
\n\
The link is valid for {2}. If you did not ask for a new password, ignore this message — your current password stays unchanged.\n
identity.mail.reset.body.html=<p>Hello {0},</p>\
<p>you can set a new password using this link:</p>\
<p><a href="{1}">Set a new password</a></p>\
<p>If the link does not open, copy this address into the address bar of your browser:<br>{1}</p>\
<p>The link is valid for {2}. If you did not ask for a new password, ignore this message — your current password stays unchanged.</p>

identity.mail.invitation.subject=You have been invited
identity.mail.invitation.body=Hello {0},\n\
\n\
an account has been created for you. Use this link to set your password and sign in:\n\
\n\
{1}\n\
\n\
The link is valid for {2}. If this means nothing to you, please ignore this message.\n
identity.mail.invitation.body.html=<p>Hello {0},</p>\
<p>an account has been created for you. Use this link to set your password and sign in:</p>\
<p><a href="{1}">Set your password</a></p>\
<p>If the link does not open, copy this address into the address bar of your browser:<br>{1}</p>\
<p>The link is valid for {2}. If this means nothing to you, please ignore this message.</p>

# ChoiceFormat statt vier Schluesseln: Singular und Plural in einem Muster.
identity.mail.validity.days={0,choice,1#one day|1<{0} days}
identity.mail.validity.hours={0,choice,1#one hour|1<{0} hours}
identity.mail.validity.minutes={0,choice,1#one minute|1<{0} minutes}
