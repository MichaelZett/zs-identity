# Texte von identity-core: Mails und die Meldungen zu IdentityMessageKeys.
# Diese Datei ohne Sprachkuerzel ist die Rueckfallebene und deshalb englisch —
# sie greift fuer jede Sprache, zu der es keine eigene Datei gibt.
# Platzhalter sind MessageFormat-Muster ({0}, {1}), nicht %s.

identity.error.emailAlreadyRegistered=An account already exists for this e-mail address.
identity.error.passwordTooShort=The password must be at least {0} characters long.
identity.error.selfRegistrationDisabled=Registration is switched off for this application.
identity.error.tokenInvalid=This link has expired or has already been used. Please request a new one.
identity.error.tokenExpired=This link has expired or has already been used. Please request a new one.
identity.error.defaultRoleMissing=That did not work. Please try again later.
identity.error.accountNotFound=That did not work. Please try again later.
identity.error.unexpected=That did not work. Please try again later.

identity.mail.verification.subject=Please confirm your e-mail address
identity.mail.verification.body=Hello {0},\n\
\n\
please confirm your e-mail address using this link:\n\
\n\
{1}\n\
\n\
The link is valid for {2}. If you did not register, you can ignore this message.\n
identity.mail.reset.subject=Reset your password
identity.mail.reset.body=Hello {0},\n\
\n\
you can set a new password using this link:\n\
\n\
{1}\n\
\n\
The link is valid for {2}. If you did not ask for a new password, ignore this message — your current password stays unchanged.\n

# ChoiceFormat statt vier Schluesseln: Singular und Plural in einem Muster.
identity.mail.validity.hours={0,choice,1#one hour|1<{0} hours}
identity.mail.validity.minutes={0,choice,1#one minute|1<{0} minutes}
