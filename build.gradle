import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'base'
    id 'net.ltgt.errorprone' version "${errorproneGradleVersion}" apply false
    id 'net.ltgt.nullaway' version "${nullawayGradleVersion}" apply false
    id 'com.github.spotbugs' version "${spotbugsGradleVersion}" apply false
    id 'io.github.ben-manes.versions' version "${benmanesVersion}" apply false
    id 'com.vanniktech.maven.publish' version "${vanniktechPublishVersion}" apply false
    id 'org.sonarqube' version "${sonarVersion}"
    id 'org.openrewrite.rewrite' version "${rewriteGradleVersion}"
}

// OpenRewrite runs on demand only (./gradlew rewriteDryRun or rewriteRun),
// never as part of `build`: a tool that rewrites sources does not belong in a
// run whose result nobody looks at.
//
// The recipes come from the neighbouring project zettsystems-recipes (Maven
// Central). Only the PURE refactorings are active (ZettSystemsRecipes);
// UseToListTrue and UseFloorMod change behaviour and are invoked individually
// on purpose, when someone really means to read the diff.
//
// Invocation:  ./gradlew rewriteDryRun --no-parallel --no-configuration-cache
// The plugin gets along with neither org.gradle.parallel (it resolves other
// configurations without an exclusive lock) nor the configuration cache (it
// reaches for Project at execution time). Both are switched on in
// gradle.properties, but for `build` -- hence the flags here only, rather than
// giving up the settings of the whole project for a tool that runs rarely.
//
// The plugin is deliberately pinned to 7.39.0: 7.40.0 and 7.41.0 point at a
// rewrite-bom 8.91.0 that is not in Maven Central (as of 2026-09-17), so the
// build fails while resolving.
dependencies {
    rewrite platform("org.openrewrite.recipe:rewrite-recipe-bom:${rewriteRecipeBomVersion}")
    rewrite "de.zettsystems:zettsystems-recipes:${zettsystemsRecipesVersion}"
    rewrite 'org.openrewrite.recipe:rewrite-static-analysis'
    rewrite 'org.openrewrite.recipe:rewrite-migrate-java'
    rewrite 'org.openrewrite.recipe:rewrite-testing-frameworks'
    rewrite 'org.openrewrite.recipe:rewrite-logging-frameworks'
    rewrite 'org.openrewrite.recipe:rewrite-spring'
}

rewrite {
    // Curated, not "everything there is": every recipe here was run against the
    // codebase as a dry run and its diff was read.
    activeRecipe('de.zettsystems.ZettSystemsRecipes')
    activeRecipe('org.openrewrite.staticanalysis.CodeCleanup')
    activeRecipe('org.openrewrite.java.RemoveUnusedImports')
    //
    // Checked and DELIBERATELY left out (2026-09-17):
    //  - org.openrewrite.java.logging.slf4j.Slf4jBestPractices raises
    //    LOG.debug(.., e) to LOG.error and turns readable calls into the fluent
    //    API. The levels here are reasoned decisions (see the comments on the
    //    catch blocks), not carelessness.
    //  - org.openrewrite.java.testing.{junit5,assertj}.* want to write
    //    `useJUnitPlatform()` into EVERY subproject script; it has long been in
    //    the subprojects block of the root. The one real improvement from them
    //    (Optional assertions) has been taken over.
    //  - org.openrewrite.java.migrate.UpgradeToJava21 and ...UpgradeToJava25
    //    change NOTHING in the Java code (it is long since up to date) and
    //    leave behind only marker comments in the build script: the toolchain
    //    sits here as a property (`JavaLanguageVersion.of("${javaVersion}")`)
    //    that the recipe cannot resolve. `javaVersion=25` in gradle.properties
    //    is the truth, not the recipe.
    //  - org.openrewrite.java.migrate.lang.UseTextBlocks turns wrapped messages
    //    into text blocks with line continuations (\ at the end of the line).
    //    A gain for multi-line text (SQL), the opposite for a wrapped sentence
    //    -- 7 places checked, all would read worse.
    //  - org.openrewrite.java.migrate.lang.var.UseVarForObject would introduce
    //    `var` in 54 places. This project spells types out (8 `var` in the
    //    whole codebase); that is style, not an omission.
    //  - Spring: there is no `SpringBoot4BestPractices` -- rewrite-spring has
    //    only twelve targeted boot4 recipes. Checked with no findings:
    //    SpringBootProperties_4_0/_4_1, MigrateAutoconfigurePackages,
    //    ReplaceMockBeanAndSpyBean, SpringSecurityBestPractices and
    //    boot3.SpringBoot3BestPractices. MigrateToModularStarters did have one
    //    finding (spring-security-test -> spring-boot-starter-security-test);
    //    it has been applied, and the recipe itself is a one-off migration and
    //    therefore stays out.
    // The build scripts are processed too: `exclusion(..)` does not apply to
    // them. OpenRewrite shortens qualified class names in them (for example
    // com.github.spotbugs.snom.Effort -> Effort) and does NOT add the import,
    // which is why the imports sit at the top of the script by hand.
}

// ErrorProne checks raised to ERROR as a safety net.
ext.errorproneEnforcedChecks = [
        'ArrayRecordComponent',
        'EmptyCatch',
        'EqualsGetClass',
        'FutureReturnValueIgnored',
        'InlineFormatString',
        'JavaTimeDefaultTimeZone',
        'JdkObsolete',
        'MissingOverride',
        'MixedMutabilityReturnType',
        'OperatorPrecedence',
        'ReferenceEquality',
        'StringSplitter',
        'SuperCallToObjectMethod',
        'UnnecessaryMethodReference',
]

// Filters for `dependencyUpdates`. Defined before the subprojects block so that
// the closures are already resolvable there.
ext.depUpdateIsUnstable = { String version ->
    def stableKeywords = ['RELEASE', 'FINAL', 'GA']
    def stable = stableKeywords.any { version.toUpperCase(Locale.ROOT).contains(it) }
    def numericLooking = version ==~ /^[0-9,.v-]+(-r)?$/
    return !stable && !numericLooking
}

ext.depUpdateIsMajorBump = { String current, String candidate ->
    def cur = current.split(/[.\-]/, 2)[0]
    def cand = candidate.split(/[.\-]/, 2)[0]
    return cur.isInteger() && cand.isInteger() && cand.toInteger() > cur.toInteger()
}

// Excluded from the coverage measurement: auto-configuration and JPA entities.
// The Vaadin views are back in since the Karibu tests.
ext.coverageExclusions = [
        '**/configuration/**',
        '**/domain/**',
]

// The artifact ids alone ("identity-core") read thinly in the Central Portal
// and in search results; the POM carries a name worth reading.
ext.pomNames = [
        'identity-core'  : 'ZS Identity Core',
        'identity-vaadin': 'ZS Identity Vaadin',
]

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'signing'
    apply plugin: 'com.vanniktech.maven.publish'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'net.ltgt.errorprone'
    apply plugin: 'net.ltgt.nullaway'
    apply plugin: 'io.github.ben-manes.versions'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of("${javaVersion}")
        }
    }

    // Automatic-Module-Name instead of module-info.java: the building block
    // runs with Spring, Hibernate and Vaadin on the classpath, not on the
    // module path -- a real module descriptor would have no effect there and
    // would be a shackle here (reflection needs `opens`, and the message
    // bundles of both artifacts live in the same resource package). The
    // manifest entry costs nothing by contrast and gives an application that
    // uses JPMS itself a STABLE module name: without it Java derives one from
    // the file name, and that changes with every version.
    tasks.named('jar') {
        manifest {
            attributes('Automatic-Module-Name': "de.zettsystems.identity"
                    + (project.name == 'identity-vaadin' ? '.ui' : ''))
        }
    }

    jacoco {
        toolVersion = "${jacocoVersion}"
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        // A native Gradle platform instead of io.spring.dependency-management:
        // this way the BOM ends up in the module metadata of the artifact, and
        // the plugin is incompatible with the configuration cache when
        // generating the POM.
        api platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
        annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
        testAnnotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
        errorprone platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")

        compileOnly "org.jetbrains:annotations:${jetbrainsAnnotationsVersion}"
        testCompileOnly "org.jetbrains:annotations:${jetbrainsAnnotationsVersion}"
        api 'org.jspecify:jspecify'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        errorprone "com.google.errorprone:error_prone_core:${errorproneCoreVersion}"
        errorprone "com.uber.nullaway:nullaway:${nullawayCoreVersion}"
    }

    tasks.withType(JavaCompile).configureEach {
        // Explicitly UTF-8 rather than the platform default (Windows: CP1252):
        // the German message bundles contain umlauts throughout.
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        // Doclint trips over free-standing inline tags; the form of the
        // documentation is not a build criterion.
        options.addStringOption('Xdoclint:none', '-quiet')
        failOnError = false
    }

    tasks.named('compileJava').configure {
        options.errorprone {
            disableWarningsInGeneratedCode = true
            excludedPaths = '.*/build/generated/.*'
            // Reports every inline tag in files containing non-ASCII characters.
            disable('UnrecognisedJavadocTag')
            // Throws an internal exception intermittently (a bug in the check).
            disable('StringConcatToTextBlock')
            nullaway {
                severity = CheckSeverity.ERROR
                annotatedPackages.add('de.zettsystems')
            }
            rootProject.ext.errorproneEnforcedChecks.each { check -> error(check) }
        }
    }

    tasks.named('compileTestJava').configure {
        options.errorprone.enabled = false
    }

    spotbugs {
        // Real enum values instead of the strings 'max'/'low': Gradle 9 warns
        // about the silent conversion, Gradle 10 rejects it.
        effort = Effort.valueOf('MAX')
        reportLevel = Confidence.valueOf('LOW')
        excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
    }

    tasks.withType(SpotBugsTask).configureEach {
        reports {
            html {
                required = true
                outputLocation = layout.buildDirectory.file("reports/spotbugs/${name}.html")
            }
            sarif {
                required = true
                outputLocation = layout.buildDirectory.file("reports/spotbugs/${name}.sarif")
            }
            xml.required = false
        }
    }

    // SpotBugs on test code is almost pure noise (Serializable, EI_EXPOSE patterns).
    tasks.named('spotbugsTest') {
        enabled = false
    }

    tasks.named('test') {
        useJUnitPlatform()
        systemProperty 'postgres.version', "${postgresVersion}"
    }

    jacocoTestReport {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
        }
    }

    jacocoTestCoverageVerification {
        dependsOn tasks.named('jacocoTestReport')
        // setFrom, not from: from() adds to the default set the plugin
        // installed, which would leave the exclusions without effect.
        classDirectories.setFrom(files(sourceSets.main.output).asFileTree.matching {
            rootProject.ext.coverageExclusions.each { pattern -> exclude pattern }
        })
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = 0.78
                }
                limit {
                    counter = 'BRANCH'
                    value = 'COVEREDRATIO'
                    minimum = 0.80
                }
            }
        }
    }

    tasks.named('check') {
        dependsOn tasks.named('jacocoTestReport')
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }

    // Publishing: Maven Central from 1.0.0 on, GitHub Packages alongside for
    // the applications that already depend on it, and mavenLocal
    // (./gradlew publishToMavenLocal for local iteration with an application).
    //
    // The publish plugin builds the publication, the sources and javadoc jars
    // and the signatures; Central rejects a bundle without any of them. The
    // setup is copied from zettsystems-recipes, which publishes the same way.
    //
    // Credentials: mavenCentralUsername/mavenCentralPassword (the portal's
    // publisher token) and gpr.user/gpr.key in ~/.gradle/gradle.properties, or
    // the ORG_GRADLE_PROJECT_* and GITHUB_* variables in CI.
    //
    // Locally the GPG agent holds the key; CI hands the key in through
    // `signingInMemoryKey`, which the publish plugin wires up on its own.
    if (!project.hasProperty('signingInMemoryKey')) {
        signing {
            useGpgCmd()
        }
    }

    mavenPublishing {
        // Uploads to the Central Portal (https://central.sonatype.com). The
        // bundle is only validated, never released automatically -- release it
        // by hand in the portal: a version on Central can never be removed or
        // replaced.
        publishToMavenCentral()
        signAllPublications()

        pom {
            name = rootProject.ext.pomNames[project.name]
            description = project.description
            url = 'https://github.com/MichaelZett/zs-identity'
            inceptionYear = '2026'
            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'michaelzett'
                    name = 'Michael Zoeller'
                    email = 'michael2.zoeller@gmail.com'
                    organization = 'ZettSystems'
                    organizationUrl = 'https://zettsystems.de/'
                }
            }
            scm {
                url = 'https://github.com/MichaelZett/zs-identity'
                connection = 'scm:git:https://github.com/MichaelZett/zs-identity.git'
                developerConnection = 'scm:git:ssh://git@github.com/MichaelZett/zs-identity.git'
            }
            issueManagement {
                system = 'GitHub'
                url = 'https://github.com/MichaelZett/zs-identity/issues'
            }
        }
    }

    publishing {
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/MichaelZett/zs-identity')
                credentials {
                    username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                    password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }

    // Show stable releases only, and no major bumps. Overrides:
    //   ./gradlew dependencyUpdates -Punstable   (shows RC/M/beta)
    //   ./gradlew dependencyUpdates -Pmajor      (shows major bumps)
    dependencyUpdates {
        rejectVersionIf { selection ->
            def allowUnstable = project.hasProperty('unstable')
            def allowMajor = project.hasProperty('major')
            if (!allowUnstable
                    && rootProject.ext.depUpdateIsUnstable(selection.candidate.version)
                    && !rootProject.ext.depUpdateIsUnstable(selection.currentVersion)) {
                return true
            }
            if (!allowMajor
                    && rootProject.ext.depUpdateIsMajorBump(selection.currentVersion, selection.candidate.version)) {
                return true
            }
            return false
        }
    }
}

// Sonar runs in two places. Locally it talks to the developer's own SonarQube
// instance; in CI it talks to SonarQube Cloud (formerly SonarCloud), which is
// free for public projects. The switch is the organization: if one is given,
// Cloud is meant, otherwise localhost. Nothing has to be passed for the local
// run -- that is the case that happens daily.
def sonarOrganization = findProperty('sonar.organization') ?: System.getenv('SONAR_ORGANIZATION')
def sonarHostDefault = sonarOrganization ? 'https://sonarcloud.io' : 'http://localhost:9000'
// Cloud derives the project key from owner and repository when a GitHub repo
// is imported; the local instance has its own short key.
def sonarKeyDefault = sonarOrganization ? 'MichaelZett_zs-identity' : 'zs-identity'

sonar {
    properties {
        property 'sonar.projectKey', findProperty('sonar.projectKey') ?: sonarKeyDefault
        property 'sonar.projectName', 'zs-identity'
        property 'sonar.host.url',
                findProperty('sonar.host.url') ?: System.getenv('SONAR_HOST_URL') ?: sonarHostDefault
        if (sonarOrganization) {
            property 'sonar.organization', sonarOrganization
        }
        def sonarTokenValue = findProperty('sonar.token') ?: System.getenv('SONAR_TOKEN')
        if (sonarTokenValue) {
            property 'sonar.token', sonarTokenValue
        }
        // Mirrors ext.coverageExclusions (.class patterns there, .java here).
        property 'sonar.coverage.exclusions', '**/configuration/**,**/domain/**'
        // The Serializable rules are pure noise with Vaadin and Spring; java:S2160
        // complains about every JPA entity that inherits equals/hashCode from
        // AbstractAuthEntity; java:S110 counts the Vaadin hierarchy as our
        // inheritance depth. java:S107 counts the parameters of the service
        // constructors: nobody calls those by hand -- they are the dependency
        // list of a bean that IdentityBeans wires explicitly (rule "no
        // @ComponentScan"), so the number says nothing about how complex the
        // class is. Scoped to the services; a real method with eight
        // parameters is still reported everywhere else.
        //
        // Three more that only SonarQube Cloud raises:
        // - plsql:* reads the Flyway scripts as Oracle PL/SQL. They are
        //   PostgreSQL ("VARCHAR2" does not exist there), the UPDATE without
        //   WHERE in V1_2 is a deliberate backfill of every row, and a script
        //   that ran once may never change again (Flyway's checksum).
        // - javascript:S7785 wants top-level await in the passkey scripts. They
        //   run as the body of a function through executeJs, where top-level
        //   await is a syntax error; `return run(this)` is the only form.
        // - java:S2077 on IdentityMigrations: the SQL is assembled from schema
        //   and table names, which cannot be bound as parameters. They are
        //   quoted with doubled quotes (`qualified`), every value is bound.
        //   Scoped to this one class; dynamic SQL anywhere else still counts.
        property 'sonar.issue.ignore.multicriteria', 's1948,s2160,s110,s107,plsql,s7785,s2077'
        property 'sonar.issue.ignore.multicriteria.s2160.ruleKey', 'java:S2160'
        property 'sonar.issue.ignore.multicriteria.s2160.resourceKey', '**/domain/**/*.java'
        property 'sonar.issue.ignore.multicriteria.s1948.ruleKey', 'java:S1948'
        property 'sonar.issue.ignore.multicriteria.s1948.resourceKey', '**/*.java'
        property 'sonar.issue.ignore.multicriteria.s110.ruleKey', 'java:S110'
        property 'sonar.issue.ignore.multicriteria.s110.resourceKey', '**/ui/**/*.java'
        property 'sonar.issue.ignore.multicriteria.s107.ruleKey', 'java:S107'
        property 'sonar.issue.ignore.multicriteria.s107.resourceKey', '**/application/**/*.java'
        property 'sonar.issue.ignore.multicriteria.plsql.ruleKey', 'plsql:*'
        property 'sonar.issue.ignore.multicriteria.plsql.resourceKey', '**/db/identity/*.sql'
        property 'sonar.issue.ignore.multicriteria.s7785.ruleKey', 'javascript:S7785'
        property 'sonar.issue.ignore.multicriteria.s7785.resourceKey', '**/ui/passkey-*.js'
        property 'sonar.issue.ignore.multicriteria.s2077.ruleKey', 'java:S2077'
        property 'sonar.issue.ignore.multicriteria.s2077.resourceKey', '**/configuration/IdentityMigrations.java'
    }
}
