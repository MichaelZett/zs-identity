import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'base'
    id 'net.ltgt.errorprone' version "${errorproneGradleVersion}" apply false
    id 'net.ltgt.nullaway' version "${nullawayGradleVersion}" apply false
    id 'com.github.spotbugs' version "${spotbugsGradleVersion}" apply false
    id 'io.github.ben-manes.versions' version "${benmanesVersion}" apply false
    id 'org.sonarqube' version "${sonarVersion}"
    id 'org.openrewrite.rewrite' version "${rewriteGradleVersion}"
}

// OpenRewrite laeuft nur auf Zuruf (./gradlew rewriteDryRun bzw. rewriteRun),
// nie als Teil von `build`: Ein Werkzeug, das Quellen umschreibt, gehoert
// nicht in einen Lauf, dessen Ergebnis man nicht ansieht.
//
// Die Rezepte kommen aus dem Nachbarprojekt zettsystems-recipes (Maven
// Central). Aktiv sind nur die REINEN Refactorings (ZettSystemsRecipes) —
// UseToListTrue und UseFloorMod aendern Verhalten und werden bewusst einzeln
// aufgerufen, wenn man den Diff wirklich lesen will.
//
// Aufruf:  ./gradlew rewriteDryRun --no-parallel --no-configuration-cache
// Das Plugin vertraegt weder org.gradle.parallel (es loest fremde
// Konfigurationen ohne exklusive Sperre auf) noch den Configuration-Cache
// (es greift zur Ausfuehrungszeit auf Project zu). Beides steht in
// gradle.properties an, gilt aber fuer `build` — deshalb die Flags nur hier,
// statt die Einstellungen des ganzen Projekts fuer ein Werkzeug aufzugeben,
// das selten laeuft.
//
// Plugin bewusst auf 7.39.0: 7.40.0/7.41.0 verweisen auf ein rewrite-bom
// 8.91.0, das (Stand 2026-09-17) nicht in Maven Central liegt — der Build
// scheitert dann schon beim Aufloesen.
dependencies {
    rewrite platform("org.openrewrite.recipe:rewrite-recipe-bom:${rewriteRecipeBomVersion}")
    rewrite "de.zettsystems:zettsystems-recipes:${zettsystemsRecipesVersion}"
    rewrite 'org.openrewrite.recipe:rewrite-static-analysis'
    rewrite 'org.openrewrite.recipe:rewrite-migrate-java'
    rewrite 'org.openrewrite.recipe:rewrite-testing-frameworks'
    rewrite 'org.openrewrite.recipe:rewrite-logging-frameworks'
    rewrite 'org.openrewrite.recipe:rewrite-spring'
}

rewrite {
    // Kuratiert, nicht "alles, was es gibt": Jedes Rezept hier wurde am
    // Bestand trocken laufen gelassen und sein Diff gelesen.
    activeRecipe('de.zettsystems.ZettSystemsRecipes')
    activeRecipe('org.openrewrite.staticanalysis.CodeCleanup')
    activeRecipe('org.openrewrite.java.RemoveUnusedImports')
    //
    // Geprueft und BEWUSST draussen (2026-09-17):
    //  - org.openrewrite.java.logging.slf4j.Slf4jBestPractices hebt
    //    LOG.debug(.., e) auf LOG.error an und macht aus lesbaren Aufrufen die
    //    Fluent-API. Die Level hier sind begruendete Entscheidungen (siehe die
    //    Kommentare an den Fangbloecken), keine Nachlaessigkeit.
    //  - org.openrewrite.java.testing.{junit5,assertj}.* wollen
    //    `useJUnitPlatform()` in JEDES Teilprojekt-Skript schreiben; es steht
    //    laengst im subprojects-Block der Wurzel. Die eine echte Verbesserung
    //    daraus (Optional-Assertions) ist uebernommen.
    //  - org.openrewrite.java.migrate.UpgradeToJava21 und ...UpgradeToJava25
    //    aendern am Java-Code NICHTS (er ist laengst auf dem Stand) und
    //    hinterlassen im Build-Skript nur Marker-Kommentare: Die Toolchain
    //    steht hier als Property (`JavaLanguageVersion.of("${javaVersion}")`),
    //    die das Rezept nicht aufloesen kann. `javaVersion=25` in
    //    gradle.properties ist die Wahrheit, nicht das Rezept.
    //  - org.openrewrite.java.migrate.lang.UseTextBlocks macht aus umbrochenen
    //    Meldungen Textbloecke mit Zeilenfortsetzung (\ am Zeilenende). Bei
    //    mehrzeiligem Text (SQL) ein Gewinn, bei einem umbrochenen Satz das
    //    Gegenteil — 7 Stellen geprueft, alle waeren schlechter lesbar.
    //  - org.openrewrite.java.migrate.lang.var.UseVarForObject wuerde an 54
    //    Stellen `var` einsetzen. Das Projekt schreibt Typen aus (8 `var` im
    //    ganzen Bestand); das ist Stil, kein Versaeumnis.
    //  - Spring: Ein `SpringBoot4BestPractices` gibt es nicht — rewrite-spring
    //    hat nur zwoelf gezielte boot4-Rezepte. Geprueft und ohne Befund:
    //    SpringBootProperties_4_0/_4_1, MigrateAutoconfigurePackages,
    //    ReplaceMockBeanAndSpyBean, SpringSecurityBestPractices und
    //    boot3.SpringBoot3BestPractices. MigrateToModularStarters hatte einen
    //    Befund (spring-security-test -> spring-boot-starter-security-test);
    //    er ist angewandt, das Rezept selbst ist eine Einmal-Migration und
    //    bleibt deshalb draussen.
    // Die Build-Skripte laufen mit: `exclusion(..)` greift fuer sie nicht.
    // OpenRewrite kuerzt darin qualifizierte Klassennamen (etwa
    // com.github.spotbugs.snom.Effort -> Effort) und ergaenzt den Import
    // NICHT — deshalb stehen die Importe oben im Skript von Hand.
}

// ErrorProne-Checks, die als Sicherheitsnetz auf ERROR stehen.
ext.errorproneEnforcedChecks = [
        'ArrayRecordComponent',
        'EmptyCatch',
        'EqualsGetClass',
        'FutureReturnValueIgnored',
        'InlineFormatString',
        'JavaTimeDefaultTimeZone',
        'JdkObsolete',
        'MissingOverride',
        'MixedMutabilityReturnType',
        'OperatorPrecedence',
        'ReferenceEquality',
        'StringSplitter',
        'SuperCallToObjectMethod',
        'UnnecessaryMethodReference',
]

// Filter fuer `dependencyUpdates`. Vor dem subprojects-Block definieren, damit
// die Closures dort bereits aufloesbar sind.
ext.depUpdateIsUnstable = { String version ->
    def stableKeywords = ['RELEASE', 'FINAL', 'GA']
    def stable = stableKeywords.any { version.toUpperCase(Locale.ROOT).contains(it) }
    def numericLooking = version ==~ /^[0-9,.v-]+(-r)?$/
    return !stable && !numericLooking
}

ext.depUpdateIsMajorBump = { String current, String candidate ->
    def cur = current.split(/[.\-]/, 2)[0]
    def cand = candidate.split(/[.\-]/, 2)[0]
    return cur.isInteger() && cand.isInteger() && cand.toInteger() > cur.toInteger()
}

// Aus der Coverage-Messung heraus: Auto-Konfiguration und JPA-Entities.
// Die Vaadin-Ansichten sind seit den Karibu-Tests wieder drin.
ext.coverageExclusions = [
        '**/configuration/**',
        '**/domain/**',
]

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'maven-publish'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'net.ltgt.errorprone'
    apply plugin: 'net.ltgt.nullaway'
    apply plugin: 'io.github.ben-manes.versions'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of("${javaVersion}")
        }
        withSourcesJar()
        withJavadocJar()
    }

    // Automatic-Module-Name statt module-info.java: Der Baustein laeuft mit
    // Spring, Hibernate und Vaadin auf dem Klassenpfad, nicht im Modulpfad —
    // ein echter Moduldeskriptor waere dort wirkungslos und hier eine Fessel
    // (Reflection braucht `opens`, die Sprachdateien beider Artefakte liegen im
    // selben Ressourcen-Paket). Der Manifest-Eintrag kostet dagegen nichts und
    // gibt einer Anwendung, die selbst JPMS benutzt, einen STABILEN Modulnamen:
    // ohne ihn leitet Java ihn aus dem Dateinamen ab, und der aendert sich mit
    // jedem Versionssprung.
    tasks.named('jar') {
        manifest {
            attributes('Automatic-Module-Name': "de.zettsystems.identity"
                    + (project.name == 'identity-vaadin' ? '.ui' : ''))
        }
    }

    jacoco {
        toolVersion = "${jacocoVersion}"
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        // Native Gradle-Platform statt io.spring.dependency-management: Die
        // BOM landet so in den Modul-Metadaten des Artefakts, und das Plugin
        // ist mit dem Configuration-Cache beim POM-Erzeugen unvertraeglich.
        api platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
        annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
        testAnnotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
        errorprone platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")

        compileOnly "org.jetbrains:annotations:${jetbrainsAnnotationsVersion}"
        testCompileOnly "org.jetbrains:annotations:${jetbrainsAnnotationsVersion}"
        api 'org.jspecify:jspecify'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        errorprone "com.google.errorprone:error_prone_core:${errorproneCoreVersion}"
        errorprone "com.uber.nullaway:nullaway:${nullawayCoreVersion}"
    }

    tasks.withType(JavaCompile).configureEach {
        // Explizit UTF-8 statt Plattform-Default (Windows: CP1252) — die Quellen
        // enthalten durchgaengig Umlaute.
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        // Doclint stolpert ueber freie Inline-Tags in deutschsprachigen
        // Kommentaren; Doku-Form ist kein Build-Kriterium.
        options.addStringOption('Xdoclint:none', '-quiet')
        failOnError = false
    }

    tasks.named('compileJava').configure {
        options.errorprone {
            disableWarningsInGeneratedCode = true
            excludedPaths = '.*/build/generated/.*'
            // Meldet jedes Inline-Tag in Dateien mit Nicht-ASCII-Zeichen.
            disable('UnrecognisedJavadocTag')
            // Wirft intermittierend eine interne Exception (Bug im Check).
            disable('StringConcatToTextBlock')
            nullaway {
                severity = CheckSeverity.ERROR
                annotatedPackages.add('de.zettsystems')
            }
            rootProject.ext.errorproneEnforcedChecks.each { check -> error(check) }
        }
    }

    tasks.named('compileTestJava').configure {
        options.errorprone.enabled = false
    }

    spotbugs {
        // Echte Enum-Werte statt der Zeichenketten 'max'/'low': Gradle 9 warnt
        // vor der stillen Umwandlung, Gradle 10 lehnt sie ab.
        effort = Effort.valueOf('MAX')
        reportLevel = Confidence.valueOf('LOW')
        excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
    }

    tasks.withType(SpotBugsTask).configureEach {
        reports {
            html {
                required = true
                outputLocation = layout.buildDirectory.file("reports/spotbugs/${name}.html")
            }
            sarif {
                required = true
                outputLocation = layout.buildDirectory.file("reports/spotbugs/${name}.sarif")
            }
            xml.required = false
        }
    }

    // SpotBugs auf Testcode bringt fast nur Rauschen (Serializable-, EI_EXPOSE-Muster).
    tasks.named('spotbugsTest') {
        enabled = false
    }

    tasks.named('test') {
        useJUnitPlatform()
        systemProperty 'postgres.version', "${postgresVersion}"
    }

    jacocoTestReport {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
        }
    }

    jacocoTestCoverageVerification {
        dependsOn tasks.named('jacocoTestReport')
        // setFrom, nicht from: from() addiert zur vom Plugin gesetzten Default-Menge,
        // die Ausschluesse waeren damit wirkungslos.
        classDirectories.setFrom(files(sourceSets.main.output).asFileTree.matching {
            rootProject.ext.coverageExclusions.each { pattern -> exclude pattern }
        })
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = 0.78
                }
                limit {
                    counter = 'BRANCH'
                    value = 'COVEREDRATIO'
                    minimum = 0.80
                }
            }
        }
    }

    tasks.named('check') {
        dependsOn tasks.named('jacocoTestReport')
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }

    // Veroeffentlichung: GitHub Packages (CI, Releases) und mavenLocal
    // (./gradlew publishToMavenLocal fuer die lokale Iteration mit einer App).
    // Zugangsdaten: gpr.user/gpr.key in ~/.gradle/gradle.properties oder
    // GITHUB_ACTOR/GITHUB_TOKEN in der CI.
    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
                pom {
                    name = project.name
                    description = 'Reusable identity building block for Spring Boot applications'
                    url = 'https://github.com/MichaelZett/zs-identity'
                }
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/MichaelZett/zs-identity')
                credentials {
                    username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                    password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }

    // Nur stabile Releases und keine Major-Bumps anzeigen. Override:
    //   ./gradlew dependencyUpdates -Punstable   (RC/M/Beta sichtbar)
    //   ./gradlew dependencyUpdates -Pmajor      (Major-Bumps sichtbar)
    dependencyUpdates {
        rejectVersionIf { selection ->
            def allowUnstable = project.hasProperty('unstable')
            def allowMajor = project.hasProperty('major')
            if (!allowUnstable
                    && rootProject.ext.depUpdateIsUnstable(selection.candidate.version)
                    && !rootProject.ext.depUpdateIsUnstable(selection.currentVersion)) {
                return true
            }
            if (!allowMajor
                    && rootProject.ext.depUpdateIsMajorBump(selection.currentVersion, selection.candidate.version)) {
                return true
            }
            return false
        }
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'zs-identity'
        property 'sonar.projectName', 'zs-identity'
        property 'sonar.host.url', 'http://localhost:9000'
        def sonarTokenValue = findProperty('sonar.token') ?: System.getenv('SONAR_TOKEN')
        if (sonarTokenValue) {
            property 'sonar.token', sonarTokenValue
        }
        // Spiegel von ext.coverageExclusions (dort .class-, hier .java-Muster).
        property 'sonar.coverage.exclusions', '**/configuration/**,**/domain/**'
        // Serializable-Regeln erzeugen bei Vaadin/Spring nur Rauschen; java:S2160
        // meckert bei jeder JPA-Entity, die equals/hashCode aus AbstractAuthEntity
        // erbt; java:S110 zaehlt die Vererbungstiefe mitsamt der Vaadin-Hierarchie.
        property 'sonar.issue.ignore.multicriteria', 's1948,s2160,s110'
        property 'sonar.issue.ignore.multicriteria.s2160.ruleKey', 'java:S2160'
        property 'sonar.issue.ignore.multicriteria.s2160.resourceKey', '**/domain/**/*.java'
        property 'sonar.issue.ignore.multicriteria.s1948.ruleKey', 'java:S1948'
        property 'sonar.issue.ignore.multicriteria.s1948.resourceKey', '**/*.java'
        property 'sonar.issue.ignore.multicriteria.s110.ruleKey', 'java:S110'
        property 'sonar.issue.ignore.multicriteria.s110.resourceKey', '**/ui/**/*.java'
    }
}
