org.gradle.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Artefakt-Version. Release = Version ohne -SNAPSHOT auf main pushen: die CI
# publiziert nach GitHub Packages, taggt v<version> und hebt danach selbst
# auf die naechste Patch-SNAPSHOT. SNAPSHOTs werden nie publiziert; sie
# dienen nur der lokalen Iteration (publishToMavenLocal).
version=0.6.0
group=de.zettsystems

# libraries
bootVersion=4.1.1
vaadinVersion=25.2.6
jetbrainsAnnotationsVersion=26.1.0
postgresVersion=17.10
karibuVersion=2.7.2

# plugins
javaVersion=25
benmanesVersion=0.61.0
errorproneGradleVersion=5.1.0
errorproneCoreVersion=2.50.0
nullawayGradleVersion=3.1.0
nullawayCoreVersion=0.13.8
spotbugsGradleVersion=6.5.8
jacocoVersion=0.8.15
sonarVersion=7.3.1.8318
