// Vaadin UI for the authentication building block: sign-in, registration,
// verification, password reset. Separate from :identity-core so that the core
// stays free of Vaadin. No Vaadin Gradle plugin here -- the frontend build runs
// in the embedding application, which collects the views through
// vaadin.allowed-packages.
dependencies {
    api platform("com.vaadin:vaadin-bom:${vaadinVersion}")
    api project(':identity-core')
    api 'com.vaadin:vaadin-spring-boot-starter'

    // Browserless Vaadin tests: recreates VaadinSession/UI in memory, so that
    // the views can be checked without a servlet container and without
    // Selenium.
    testImplementation "com.github.mvysny.kaributesting:karibu-testing-v24:${karibuVersion}"
}
